name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate Snake (Cherry Strategy)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            # Palette calibrata: Sfondo, Verde tenue, Verde scuro, ROSSO (Ciliegia), ROSSO intenso
            dist/github-contribution-grid-snake.svg?color_snake=#32CD32&color_dots=#ebedf0,#9be9a8,#40c463,#ff0000,#cc0000
            
            # Versione Dark
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#32CD32&color_dots=#161b22,#0e4429,#26a641,#ff4d4d,#ff0000

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
