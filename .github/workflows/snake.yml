name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # Esegue ogni mezzanotte
  workflow_dispatch: # Permette l'esecuzione manuale

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7b219f&color_dots=#ebedf0,#f4cccc,#ea9999,#e06666,#cc0000
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#32CD32&color_dots=#161b22,#ffb3b3,#ff6666,#ff0000,#8b0000

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
