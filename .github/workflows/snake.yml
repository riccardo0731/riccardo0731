name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # Esegue ogni mezzanotte
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3 # Aggiornato alla v3 per sicurezza

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            # Versione classica con ciliegie rosse
            dist/github-contribution-grid-snake.svg?color_snake=#7b219f&color_dots=#ebedf0,#f4cccc,#ea9999,#e06666,#cc0000
            
            # Versione Dark con ciliegie brillanti
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#32CD32&color_dots=#161b22,#ffb3b3,#ff6666,#ff0000,#8b0000
        
      - uses: crazy-max/ghaction-github-pages@v3.1.0 # Versione aggiornata
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
