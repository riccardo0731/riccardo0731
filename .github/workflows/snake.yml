name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate Snake (Rainbow Columns Edition)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            # Palette: Vuoto(Grigio), Rosso, Arancio, Giallo, Verde, Blu
            # Ogni livello di attività avrà un colore diverso invece di sfumature dello stesso colore
            dist/github-contribution-grid-snake.svg?color_snake=#000000&color_dots=#ebedf0,#ff0000,#ff8c00,#ffff00,#00ff00,#0000ff
            
            # Versione Dark con colori Neon
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ffffff&color_dots=#161b22,#ff4d4d,#ffa500,#ffff33,#33ff33,#3399ff

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
