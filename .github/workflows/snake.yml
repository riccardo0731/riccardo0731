name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate Snake (Cherry Simulation)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            # Versione Light: Sfondo chiaro, serpente verde, frutti rossi accesi
            dist/github-contribution-grid-snake.svg?color_snake=#2ecc71&color_dots=#ebedf0,#ffcccc,#ff4d4d,#cc0000,#800000
            
            # Versione Dark: Sfondo scuro, serpente verde neon, frutti rosso brillante
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00FF00&color_dots=#161b22,#ff4d4d,#ff0000,#cc0000,#7a0000

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
